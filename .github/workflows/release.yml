name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: gtm-linux-x64
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: gtm-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: gtm-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: gtm-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Embed credentials
        shell: bash
        run: |
          # Replace placeholder credentials with actual values from secrets
          sed -i.bak 's/__OAUTH_CLIENT_ID__/${{ secrets.GOOGLE_CLIENT_ID }}/g' src/config/constants.ts
          sed -i.bak 's/__OAUTH_CLIENT_SECRET__/${{ secrets.GOOGLE_CLIENT_SECRET }}/g' src/config/constants.ts
          rm -f src/config/constants.ts.bak

      - name: Build binary
        shell: bash
        run: |
          deno compile \
            --allow-net \
            --allow-read \
            --allow-write \
            --allow-env \
            --allow-run \
            --allow-sys \
            --include src/agent-guide.md \
            --target ${{ matrix.target }} \
            --output ${{ matrix.binary }} \
            src/main.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const d = require("./deno.json").version; const n = require("./npm/package.json").version; if (d !== n || process.env.RELEASE_TAG !== `v${d}`) { console.error(`Version mismatch: tag=${process.env.RELEASE_TAG}, deno=${d}, npm=${n}`); process.exit(1); }'

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish npm package
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Include full project README
        run: cp README.md npm/README.md

      - name: Publish
        working-directory: npm
        run: npm publish --access public
